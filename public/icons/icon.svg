<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1a1a20"/>
  <!-- sala isométrica: piso + paredes -->
  <g transform="translate(256 300)">
    <!-- piso -->
    <polygon points="0,-40 150,40 0,120 -150,40" fill="#2a2a33"/>
    <!-- parede esquerda -->
    <polygon points="-150,40 -150,-60 0,20 0,-40" fill="#33333d"/>
    <!-- parede direita -->
    <polygon points="150,40 150,-60 0,20 0,-40" fill="#3a3a44"/>
    <!-- caixas (ícones empilhados) -->
    <g>
      <polygon points="-40,-10 10,18 -40,46 -90,18" fill="#4f9cff"/>
      <polygon points="-90,18 -90,-12 -40,16 -40,-10" fill="#3a7bd5"/>
      <polygon points="10,18 10,-12 -40,16 -40,18" fill="#5aa9ff"/>
    </g>
    <g transform="translate(30 -6)">
      <polygon points="-20,-52 20,-30 -20,-8 -60,-30" fill="#ff6b6b"/>
      <polygon points="-60,-30 -60,-58 -20,-36 -20,-52" fill="#d94848"/>
      <polygon points="20,-30 20,-58 -20,-36 -20,-30" fill="#ff8080"/>
    </g>
  </g>
</svg>
